name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run plugin validator (Tabs' checks, mechanized)
        run: python scripts/validate_plugin.py
      - name: Check portable bundles and distribution metadata
        run: python scripts/validate_portable.py
      - name: Test portable packaging invariants
        run: python -m unittest discover -s tests -v
